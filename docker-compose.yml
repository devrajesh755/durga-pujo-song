services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=*
    expose:
      - "5000"
    restart: unless-stopped
