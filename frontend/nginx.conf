server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # Static assets
    # ============================================================
    # CHANGE FOR RENDER:
    # Keep static assets served directly by Nginx.
    # Do NOT proxy these to the backend.

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";

        try_files $uri =404;
    }

    # ============================================================
    # API
    # ============================================================
    # CHANGE FOR RENDER:
    #
    # REMOVE the old configuration:
    #
    # location /api/ {
    #     proxy_pass http://backend:5000/api/;
    # }
    #
    # Why?
    # "backend" is a Docker Compose service name.
    # Render frontend and backend are separate services, so
    # Nginx cannot resolve "backend".
    #
    # React will call the Render backend directly using:
    #
    # VITE_API_URL=https://YOUR-BACKEND.onrender.com/api
    #
    # Therefore there is NO /api proxy here.

    # ============================================================
    # React SPA routing
    # ============================================================
    # CHANGE FOR RENDER:
    # Keep this so React Router routes work correctly.

    location / {
        try_files $uri $uri/ /index.html;
    }
}